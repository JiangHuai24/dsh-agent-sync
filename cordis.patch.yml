- insert:
    - id: agent-sync
      name: '@local/agent-sync'
      config:
        pollMs: 3000
        sealAfterMs: 12000
        # 0 = import every session found in each application's store
        maxSessionsPerApp: 0
        maxFilesPerApp: 4000
        # Empty = <parent of the first workspace>/agent-sync-workspaces
        workspacesRoot: ''
        sources:
          workbuddy:
            enabled: true
          zcode:
            enabled: true
          codex:
            enabled: true

# --- agent-sync managed (config; edit via the settings page) ---
- id: agent-sync
  name: '@local/agent-sync'
  config:
    pollMs: 3000
    sealAfterMs: 12000
    scanEveryMs: 5000
    maxSessionsPerApp: 0
    orphanAfterMinutes: 60
    backupKeep: 10
    sweepMissing: false
    backupOnStart: true
    workspacesRoot: ""
# --- end agent-sync managed ---
