name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit, engine and client tests
        run: node --test test/core.test.mjs test/engine.test.mjs test/client.test.mjs
      - name: Format contract (skipped without a local DSH install)
        run: node --test test/format.test.mjs
